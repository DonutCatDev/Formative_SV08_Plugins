# Loaded before [display] through custom_plugins/*.cfg.
[filament_tracker]
state_path: ~/printer_data/config/filament-tracker.json
log_path: ~/printer_data/config/filament-events.csv
default_spool_grams: 3000
maximum_spool_grams: 3000
safety_margin_grams: 0
poll_interval: 0.5

[menu __main __filament __new_spool]
type: command
enable: {printer.print_stats.state not in ("printing", "paused")}
name: New Spool
index: 0
gcode:
    FILAMENT_TRACKER_NEW_SPOOL

[menu __main __filament1 __new_spool]
type: command
enable: {printer.print_stats.state == "paused"}
name: New Spool
index: 0
gcode:
    FILAMENT_TRACKER_NEW_SPOOL
