# Include this file before options/lcd/*.cfg so the custom menu type is
# registered before Klipper constructs the primary display menu.
[lcd_vsd_browser]
extensions: gcode, g, gco
show_hidden: False
confirm_print: True
max_remembered_files: 256

# Replace the stock flat virtual-SD list. The browser supplies its own dynamic
# children, so the old M23 + separate Start-print row is not used.
[menu __main __sdcard]
type: vsd_browser
enable: {('virtual_sdcard' in printer) and not (printer.print_stats.state == "paused" or printer.idle_timeout.state == "Printing")}
name: Print
index: 6

