# Loaded before [display] through custom_plugins/*.cfg.
[print_outcome]
log_path: ~/printer_data/config/print-outcomes.csv
poll_interval: 0.25
default_quantity: 1
maximum_quantity: 9999
on_accept_gcode:
    SET_LED LED=Screen_Colour RED=0.5 GREEN=0.4 BLUE=0.7 SYNC=0
    SET_DISPLAY_GROUP GROUP=sv08_home
    M117
